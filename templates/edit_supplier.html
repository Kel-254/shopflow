{% extends "base.html" %}

{% block title %}
Lena MiniMart | Edit Supplier
{% endblock %}

{% block content %}

<header class="dashboard-header">

    <div>

        <h1>
            Edit Supplier
        </h1>

        <p>
            Update supplier information.
        </p>

    </div>

    <a
        href="{{ url_for(
            'supplier_details',
            supplier_id=supplier.id
        ) }}"
        class="secondary-button"
    >
        ← Back
    </a>

</header>


<section class="dashboard-card supplier-form-card">

    <div class="card-header">

        <div>

            <h3>
                Supplier Information
            </h3>

            <p>
                Update supplier details below.
            </p>

        </div>

    </div>


    <form method="POST">

        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-grid">

            <!-- SUPPLIER NAME -->

            <div class="form-group">

                <label>
                    Supplier Name <span>*</span>
                </label>

                <input
                    type="text"
                    name="name"
                    value="{{ supplier.name }}"
                    required
                >

            </div>


            <!-- PHONE -->

            <div class="form-group">

                <label>
                    Phone
                </label>

                <input
                    type="text"
                    name="phone"
                    value="{{ supplier.phone or '' }}"
                >

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    value="{{ supplier.email or '' }}"
                >

            </div>


            <!-- KRA PIN -->

            <div class="form-group">

                <label>
                    KRA PIN
                </label>

                <input
                    type="text"
                    name="kra_pin"
                    value="{{ supplier.kra_pin or '' }}"
                >

            </div>

            <div class="form-group">
                <label>
                    Supplier Status
                </label>
                <select name="status">
                    <option
                        value="Active"
                        {% if supplier.status == "Active" %}
                             selected
                        {% endif %}
                    >
                        Active
                    </option>
                    <option 
                        value="Inactive"
                        {% if supplier.status == "Inactive" %}
                            selected
                        {% endif %}
                    >    
                       Inactive
                    </option>

                </select>
            </div>


            <!-- ADDRESS -->

            <div class="form-group form-group-full">

                <label>
                    Address
                </label>

                <input
                    type="text"
                    name="address"
                    value="{{ supplier.address or '' }}"
                >

            </div>


            <!-- NOTES -->

            <div class="form-group form-group-full">

                <label>
                    Notes
                </label>

                <textarea
                    name="notes"
                    rows="4"
                >{{ supplier.notes or '' }}</textarea>

            </div>

        </div>


        <div class="form-actions">

            <a
                href="{{ url_for(
                    'supplier_details',
                    supplier_id=supplier.id
                ) }}"
                class="secondary-button"
            >
                Cancel
            </a>

            <button
                type="submit"
                class="primary-button"
            >
                Save Changes
            </button>

        </div>

    </form>

</section>

{% endblock %}
